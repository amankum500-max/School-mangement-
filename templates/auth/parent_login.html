<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parent Portal Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: linear-gradient(135deg, #10b981 0%, #059669 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { background: white; padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center; }
  input { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; margin-bottom: 15px; }
  button { width: 100%; padding: 14px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .error { background: #fee2e2; color: #dc2626; padding: 10px; border-radius: 8px; margin-bottom: 20px; }
  .link { display: block; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
  <div class="login-box">
    <div style="font-size: 50px; margin-bottom: 10px;">👨‍👩‍👧</div>
    <h1 style="margin-bottom: 20px; color: #065f46;">Parent Portal</h1>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="error">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    
    <form method="POST">
      <input type="text" name="username" placeholder="Parent Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">View Child's Progress</button>
    </form>
    <a href="/" class="link">← Back to Admin Login</a>
  </div>
</body>
</html>
